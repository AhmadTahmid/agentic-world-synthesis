  - terrain_id: void
    tile_family: lumenfold_ground
    tile_dimensions: {width: 32, height: 32}
    legal_neighbors: [void]
    render_layer: base
    base_tile: {id: void_base, asset_path: assets/tiles/lumenfold_terrain_atlas.svg, atlas_cell: {x: 0, y: 10}, weight: 1}
    movement: {passable: false, speed_multiplier: 1.0, collision: blocked}
    license: *project_license
