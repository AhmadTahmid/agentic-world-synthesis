schema_version: 2
tile_size: 32
player_archetype_id: lumen_scout
archetypes:
  - id: tavern_house
    asset_path: assets/objects/tavern_house.svg
    pixel_size: {width: 160, height: 128}
    tile_size: {width: 5, height: 4}
    ground_anchor: {x: 2, y: 3}
    render_category: structure
    collision: {kind: rect, rect: {x: -2, y: -3, width: 5, height: 4}}
    interaction_sockets: [{id: sign, offset: {x: -2, y: 0}, prompt: Read tavern sign}]
    doorway_sockets: [{id: main_door, offset: {x: 0, y: 0}, prompt: Enter}]
    visual_layers:
      - {role: shadow, asset_path: assets/objects/layers/building_shadow.svg, pixel_size: {width: 160, height: 128}}
      - {role: base, asset_path: assets/objects/layers/tavern_base.svg, pixel_size: {width: 160, height: 128}}
      - {role: foreground, asset_path: assets/objects/layers/tavern_roof.svg, pixel_size: {width: 160, height: 128}}
    tags: [building, warm, timber, tavern]
    color: "#c77945"
    license: &project_license {creator: WorldSynth sample project, source_url: project://assets, license: CC0-1.0, attribution_required: false}
