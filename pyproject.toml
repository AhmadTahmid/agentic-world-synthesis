[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "agentic-worldsynth"
version = "0.1.0"
description = "Deterministic specification-first world compiler for a Godot top-down RPG"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
  "pydantic>=2.10,<3",
  "PyYAML>=6.0.2,<7",
  "typer>=0.15,<1",
  "Pillow>=11,<13",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3,<10",
  "ruff>=0.9,<1",
  "mypy>=1.14,<2",
  "types-PyYAML>=6.0.12",
]

[project.scripts]
worldsynth = "worldsynth.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"
exclude = ["generated", "game/generated", ".venv"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["worldsynth"]
exclude = ["tests"]
